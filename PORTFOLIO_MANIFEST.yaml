## Scoring Dimensions (Template for Automation)

Each project is scored on:

| Dimension | Weight | Source |
|---|---|---|
| Test Coverage | 15% | `pytest --collect-only` + coverage |
| CI Health | 15% | GitHub Actions status |
| Dependency Freshness | 10% | Dependabot alerts + `pip list --outdated` |
| Documentation | 10% | README completeness + API docs |
| Active Development | 15% | Commits in last 30 days |
| Security Posture | 15% | `gitleaks` + `bandit` + CodeQL |
| Operator Utility | 20% | Manual self-reported: "did I use this today?" |

**Target:** Auto-generated weekly scorecard.

---

## Backlog Rules

1. A project drops below 40/100 → auto-flag for review
2. A project has 0 commits in 90 days → auto-flag for archival
3. A project's deps have HIGH CVE → auto-create "bump deps" task
4. A project's tests fail on main → auto-create "fix CI" task (top priority)

---

*Canonical. Update weekly via automated scan. Manual overrides allowed.*
