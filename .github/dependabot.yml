version: 2
updates:
  # Root package (if any top-level deps exist)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python packages
  - package-ecosystem: pip
    directory: "/packages/core"
