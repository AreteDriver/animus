name: Publish Quorum (convergentAI)

on:
  push:
    tags: ["quorum-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "packages/quorum/[dev]"

      - name: Run tests
        run: PYTHONPATH=packages/quorum/python pytest packages/quorum/tests/ -q --no-header --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build packages/quorum/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/quorum/dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          files: packages/quorum/dist/*
