name: Publish Kernel to TestPyPI

on:
  push:
    branches: [main]
    tags: ["kernel-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "packages/kernel/[dev]"

      - name: Run tests
        run: pytest packages/kernel/tests/ -q --no-header --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build packages/kernel/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/kernel/dist/
