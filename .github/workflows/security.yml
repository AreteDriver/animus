name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, forge, quorum, bootstrap]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Upgrade pip (fixes CVE-2026-6357)
        run: pip install --upgrade "pip>=26.1"
      - name: Install dependencies
        # animus-types is a sibling pip-installable package and is not
        # published to PyPI — pip resolves it locally when both -e
        # targets are part of the same install transaction. Affects
        # core + forge; quorum + bootstrap don't import animus_types
        # but the extra -e is harmless.
        run: pip install -e packages/types/ -e "packages/${{ matrix.package }}/" pip-audit
      - name: Upgrade vulnerable transitive deps to fix versions
        # These are pulled in transitively (via pip-audit and dev tooling);
        # forcing the fix versions here cleans the audit without touching
        # any package's production dependency block.
        run: |
          pip install --upgrade \
            "idna>=3.15" \
            "pillow>=12.2.0" \
            "pygments>=2.20.0" \
            "requests>=2.33.0" \
            "urllib3>=2.7.0"
      - name: Run pip-audit
        # CVE-2026-3219 has no fix version available in pip itself.
        # Re-evaluate when upstream ships a fix.
        run: pip-audit --ignore-vuln CVE-2026-3219
