name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, forge, quorum, bootstrap]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Upgrade pip (fixes CVE-2026-6357)
        run: pip install --upgrade "pip>=26.1"
      - name: Install dependencies
        # animus-types is a sibling pip-installable package and is not
        # published to PyPI — only core + forge import it. Including the
        # editable install for quorum/bootstrap audits trips pip-audit
        # with "Dependency not found on PyPI and could not be audited",
        # so the install is gated to the packages that need it.
        run: |
          if [[ "${{ matrix.package }}" == "core" || "${{ matrix.package }}" == "forge" ]]; then
            pip install -e packages/types/
          fi
          pip install -e "packages/${{ matrix.package }}/" pip-audit
      - name: Upgrade vulnerable transitive deps to fix versions
        # These are pulled in transitively (via pip-audit and dev tooling);
        # forcing the fix versions here cleans the audit without touching
        # any package's production dependency block.
        run: |
          pip install --upgrade \
            "idna>=3.15" \
            "pillow>=12.2.0" \
            "pygments>=2.20.0" \
            "requests>=2.33.0" \
            "urllib3>=2.7.0"
      - name: Run pip-audit
        # CVE-2026-3219 has no fix version available in pip itself.
        # Re-evaluate when upstream ships a fix.
        #
        # CVE-2026-45829 ("ChromaToast") — pre-auth RCE in ChromaDB's exposed
        # FastAPI server (auth-before-config-parsing + HuggingFace model load).
        # No patched version exists (affects 1.0.0–1.5.8; 1.5.9 unconfirmed).
        # Not exploitable here: Animus uses chromadb ONLY as an embedded
        # PersistentClient (core/animus/memory/stores/chroma.py) — it never
        # runs the ChromaDB network server, so the vulnerable path is never
        # instantiated. Re-evaluate when upstream ships a fix; if Animus ever
        # exposes a ChromaDB HttpClient/server, REMOVE this ignore.
        run: pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-45829
