name: Publish Bootstrap

on:
  push:
    tags: ["bootstrap-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "packages/bootstrap/[dev]"

      - name: Run tests
        working-directory: packages/bootstrap
        run: pytest tests/ -q --no-header --tb=short -x

      - name: Build package
        run: |
          pip install build
          python -m build packages/bootstrap/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/bootstrap/dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: packages/bootstrap/dist/*
