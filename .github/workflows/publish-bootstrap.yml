name: Publish Bootstrap

on:
  push:
    tags: ["bootstrap-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "packages/bootstrap/[dev]"

      - name: Run tests
        working-directory: packages/bootstrap
        run: pytest tests/ -q --no-header --tb=short -x

      - name: Build package
        run: |
          pip install build
          python -m build packages/bootstrap/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/bootstrap/dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          files: packages/bootstrap/dist/*
