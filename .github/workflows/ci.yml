name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint all packages
        run: ruff check packages/

      - name: Format check
        run: ruff format --check packages/

  test-core:
    name: Test Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-core-${{ matrix.python-version }}-${{ hashFiles('packages/core/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-core-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e "packages/core/[dev,api]"

      - name: Test with coverage
        run: pytest packages/core/tests/ -v --tb=short --cov=animus --cov-report=term-missing
        env:
          ANIMUS_SKIP_INTEGRATION_TESTS: "1"

  test-quorum:
    name: Test Quorum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quorum-${{ hashFiles('packages/quorum/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-quorum-

      - name: Install dependencies
        run: pip install -e "packages/quorum/[dev]"

      - name: Test with coverage
        run: PYTHONPATH=packages/quorum/python pytest packages/quorum/tests/ -v --tb=short

  test-forge:
    name: Test Forge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-forge-${{ hashFiles('packages/forge/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-forge-

      - name: Install dependencies
        run: pip install -e "packages/forge/[dev]"

      - name: Test with coverage
        working-directory: packages/forge
        run: pytest tests/ -v --tb=short --cov=animus_forge --cov-report=term-missing

  test-bootstrap:
    name: Test Bootstrap (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bootstrap-${{ matrix.python-version }}-${{ hashFiles('packages/bootstrap/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-bootstrap-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -e "packages/bootstrap/[dev]"

      - name: Test with coverage
        run: pytest packages/bootstrap/tests/ -v --tb=short --cov=animus_bootstrap --cov-report=term-missing
        env:
          PYTHONPATH: packages/bootstrap/src

  test-counts:
    name: Test Counts
    runs-on: ubuntu-latest
    needs: [test-core, test-quorum, test-forge, test-bootstrap]
    # Only update the badge JSON on push to main; PRs just measure
    # and report so a contributor can see the impact.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install all packages
        run: |
          pip install -e "packages/quorum/[dev]"
          pip install -e "packages/forge/[dev]"
          pip install -e "packages/core/[dev,api]"
          pip install -e "packages/bootstrap/[dev]"

      - name: Capture counts
        id: counts
        run: |
          json=$(scripts/test-count.sh)
          echo "$json"
          echo "$json" > /tmp/new-counts.json
          # Surface in the run summary
          {
            echo "## Test counts"
            echo ""
            python3 -c "import json; d = json.load(open('/tmp/new-counts.json')); print(f\"| Package | Tests |\\n|---|---|\"); [print(f'| {k} | {d[k]:,} |') for k in ('core','forge','quorum','bootstrap','total')]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update badge JSON on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Preserve _comment / _captured / _command keys from existing file
          python3 <<'PY'
          import json, datetime
          new = json.load(open('/tmp/new-counts.json'))
          existing = json.load(open('.github/test-counts.json'))
          for k in ('_comment', '_captured', '_command'):
              if k in existing:
                  new[k] = existing[k]
          new['_captured'] = datetime.date.today().isoformat()
          json.dump(new, open('.github/test-counts.json', 'w'), indent=2)
          open('.github/test-counts.json', 'a').write('\n')
          PY
          if git diff --quiet .github/test-counts.json; then
            echo "No change in test counts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/test-counts.json
          git commit -m "chore(ci): refresh test-counts badge JSON [skip ci]"
          git push

  mypy:
    name: Type Check (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, forge, quorum, bootstrap]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/pyproject.toml', matrix.package)) }}
          restore-keys: ${{ runner.os }}-pip-mypy-${{ matrix.package }}-

      - name: Install package + mypy
        run: |
          pip install mypy
          if [ "${{ matrix.package }}" = "core" ]; then
            pip install -e "packages/core/[dev,api]"
          else
            pip install -e "packages/${{ matrix.package }}/[dev]"
          fi

      - name: Count mypy errors
        id: count
        run: |
          set +e
          count=$(scripts/mypy-count.sh ${{ matrix.package }})
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Current: $count errors"

      - name: Compare against baseline
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('.github/mypy-baseline.json'))['${{ matrix.package }}'])")
          current="${{ steps.count.outputs.count }}"
          echo "Baseline: $baseline"
          echo "Current:  $current"
          if [ "$current" -gt "$baseline" ]; then
            echo ""
            echo "::error::mypy regression in ${{ matrix.package }}: $current errors (baseline $baseline, +$((current - baseline)) new)"
            echo ""
            echo "If you intentionally added strict typing that surfaced these,"
            echo "run scripts/mypy-count.sh locally and update"
            echo ".github/mypy-baseline.json with the new counts."
            echo ""
            echo "If they're unintentional, fix them or revert the change."
            exit 1
          fi
          if [ "$current" -lt "$baseline" ]; then
            echo "::notice::mypy improvement in ${{ matrix.package }}: $current errors ($((baseline - current)) fewer than baseline). Consider lowering baseline in .github/mypy-baseline.json."
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    # gitleaks-action@v2 calls /repos/:owner/:repo/pulls/:id/commits on PR
    # events, which requires pull-requests: read. Without this, the action
    # fails with 403 "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test-core, test-quorum, test-forge, test-bootstrap, security]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bench-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-bench-

      - name: Install all packages
        run: |
          pip install -e "packages/quorum/[dev]"
          pip install -e "packages/forge/[dev]"
          pip install -e "packages/core/[dev,api]"

      - name: Create benchmarks output directory
        run: mkdir -p .benchmarks

      - name: Run Core benchmarks
        run: >
          pytest packages/core/tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=.benchmarks/core.json -q

      - name: Run Forge benchmarks
        working-directory: packages/forge
        run: >
          pytest tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=../../.benchmarks/forge.json -q

      - name: Run Quorum benchmarks
        run: >
          PYTHONPATH=packages/quorum/python pytest packages/quorum/tests/test_benchmarks.py
          --benchmark-only --benchmark-disable-gc --benchmark-warmup=on
          --benchmark-json=.benchmarks/quorum.json -q
        env:
          PYTHONPATH: packages/quorum/python

      - name: Merge benchmark results
        run: |
          python3 -c "
          import json, glob
          merged = {'benchmarks': []}
          for f in sorted(glob.glob('.benchmarks/*.json')):
              data = json.load(open(f))
              pkg = f.split('/')[-1].replace('.json', '')
              for b in data.get('benchmarks', []):
                  b['group'] = pkg
                  merged['benchmarks'].append(b)
          merged['machine_info'] = data.get('machine_info', {})
          merged['commit_info'] = data.get('commit_info', {})
          merged['datetime'] = data.get('datetime', '')
          json.dump(merged, open('.benchmarks/merged.json', 'w'), indent=2)
          print(f'Merged {len(merged[\"benchmarks\"])} benchmarks')
          "

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: .benchmarks/merged.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          fail-on-alert: false
          comment-on-alert: true
          benchmark-data-dir-path: dev/bench

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: .benchmarks/
          retention-days: 90

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CICD }}
        run: |
          STATUS="${{ job.status }}"
          COLOR=$([ "$STATUS" = "success" ] && echo 3066993 || echo 15158332)
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$ICON ${{ github.repository }}\",\"description\":\"Branch: ${{ github.ref_name }} | Status: $STATUS\",\"color\":$COLOR}]}"
