name: Publish Kernel (animus-kernel)

on:
  push:
    tags: ["kernel-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e "packages/kernel/[dev]"

      - name: Install test runner
        run: |
          pip install pytest pytest-asyncio
          pytest --version

      - name: Run tests
        working-directory: packages/kernel
        run: python -m pytest tests/ -q --no-header --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build packages/kernel/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/kernel/dist/

      - name: Extract release notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#kernel-v}
          awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" packages/kernel/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION; falling back to auto-generated notes."
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            cat release-notes.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            packages/kernel/dist/*
            packages/kernel/CHANGELOG.md
