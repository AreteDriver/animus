name: Publish Forge

on:
  push:
    tags: ["forge-v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # animus-types is a sibling pip-installable package not on
        # PyPI; pip resolves it locally when both -e targets share the
        # same install transaction.
        run: pip install -e packages/types/ -e "packages/forge/[dev]"

      - name: Run tests
        working-directory: packages/forge
        run: pytest tests/ -q --no-header --tb=short -x

      - name: Build package
        run: |
          pip install build
          python -m build packages/forge/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/forge/dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          files: packages/forge/dist/*
