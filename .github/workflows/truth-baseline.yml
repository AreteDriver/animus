name: Truth Baseline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  truth-baseline:
    name: Validate documented claims against reality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install pytest and package deps for test collection
        run: |
          pip install pytest
          pip install -e packages/types/
          pip install -e "packages/core/[dev]"
          pip install -e "packages/forge/[dev]"
          pip install -e "packages/bootstrap/[dev]"
          pip install -e "packages/quorum/[dev]"
          # kernel is src-based with optional deps; install editable for test collection
          if [ -f packages/kernel/pyproject.toml ]; then
            pip install -e "packages/kernel/[dev]" 2>/dev/null || pip install -e packages/kernel/ 2>/dev/null || true
          fi

      - name: Run truth baseline
        run: python scripts/truth-baseline.py

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: truth-baseline
          path: truth-baseline.json
