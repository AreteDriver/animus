{% for citizen in statuses %}
<div class="bg-animus-surface border border-animus-border rounded-lg p-4 hover:border-animus-green/50 transition-colors">
    <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-bold text-animus-text">{{ citizen.display_name }}</h3>
        <span class="status-indicator
            {% if citizen.state == 'idle' %}status-ok
            {% elif citizen.state == 'observing' %}status-warn
            {% elif citizen.state == 'proposing' %}status-ok
            {% elif citizen.state == 'error' %}status-error
            {% else %}status-error{% endif %}"
            title="{{ citizen.state }}"></span>
    </div>
    <p class="text-xs text-animus-muted mb-2">{{ citizen.description }}</p>
    <div class="flex items-center justify-between text-xs">
        <span class="text-animus-muted">State: <span class="text-animus-text">{{ citizen.state }}</span></span>
        <span class="text-animus-muted">{{ citizen.total_proposals }} proposals</span>
    </div>
    {% if citizen.recent_proposals > 0 %}
    <div class="mt-2 text-xs text-animus-green font-bold">
        {{ citizen.recent_proposals }} new in last 24h
    </div>
    {% endif %}
    <div class="mt-3">
        <a href="/citizens/{{ citizen.name }}" class="text-xs text-animus-green hover:underline">View details →</a>
    </div>
</div>
{% endfor %}
