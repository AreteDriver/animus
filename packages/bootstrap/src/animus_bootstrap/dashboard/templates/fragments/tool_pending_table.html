{% if pending %}
<table class="w-full text-sm">
    <thead>
        <tr class="border-b border-animus-border text-animus-muted">
            <th class="text-left py-2 pr-4">Tool</th>
            <th class="text-left py-2 pr-4">Arguments</th>
            <th class="text-left py-2">Action</th>
        </tr>
    </thead>
    <tbody>
        {% for p in pending %}
        <tr class="border-b border-animus-border">
            <td class="py-2 pr-4 text-animus-yellow font-bold">{{ p.tool_name }}</td>
            <td class="py-2 pr-4 text-animus-muted text-xs"><pre>{{ p.arguments }}</pre></td>
            <td class="py-2">
                <form method="post" action="/tools/approve/{{ p.id }}" class="inline">
                    <button type="submit" name="decision" value="approve"
                            class="px-3 py-1 bg-animus-green text-animus-bg rounded text-xs hover:opacity-80 mr-2">Approve</button>
                    <button type="submit" name="decision" value="deny"
                            class="px-3 py-1 bg-animus-red text-white rounded text-xs hover:opacity-80">Deny</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="text-animus-muted text-sm">No pending approvals.</p>
{% endif %}
