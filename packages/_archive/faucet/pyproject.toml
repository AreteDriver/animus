[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animus-faucet"
version = "0.1.0"
description = "Autonomous crypto faucet farming module for Animus exocortex"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "AreteDriver"}
]
keywords = ["crypto", "faucet", "automation", "blockchain", "animus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.6.0,<3",
    "pyyaml>=6.0,<7",
    "rich>=14.0.0,<15",
    "typer>=0.23.0,<1",
    "apscheduler>=3.11.0,<4",
    "httpx>=0.28.0,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
vision = ["ollama>=0.1.0,<1"]
wallet = [
    "web3>=7.0.0",
    "pysui>=0.60.0",
]
all = ["animus-faucet[browser,vision,wallet]"]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[project.scripts]
animus-faucet = "animus_faucet.cli:app"

[project.urls]
Homepage = "https://github.com/AreteDriver/animus"
Repository = "https://github.com/AreteDriver/animus"

[tool.setuptools.packages.find]
where = ["."]
include = ["animus_faucet*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP042"]  # UP042: StrEnum (keep str,Enum for 3.10 compat)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["animus_faucet"]
branch = true
omit = [
    "animus_faucet/__main__.py",
    "animus_faucet/cli.py",
    "animus_faucet/drivers/browser_driver.py",
    "animus_faucet/vision/captcha_solver.py",
]

[tool.coverage.report]
fail_under = 97
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@abstractmethod",
    "raise NotImplementedError",
]
