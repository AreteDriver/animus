[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "animus-content"
version = "0.1.0"
description = "Autonomous write-to-earn content module for the Animus exocortex"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "your-org"},
]
keywords = ["ai", "content", "write-to-earn", "web3", "crypto", "publishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0,<3",
    "pyyaml>=6.0.0,<7",
    "rich>=13.0.0,<15",
    "typer>=0.9.0,<1",
    "httpx>=0.25.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.0",
    "respx>=0.20.0",
]

[project.scripts]
animus-content = "animus_content.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/animus"
Repository = "https://github.com/your-org/animus"

[tool.setuptools.packages.find]
where = ["src"]
include = ["animus_content*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/animus_content"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 97
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@abstractmethod",
    "raise NotImplementedError",
]
