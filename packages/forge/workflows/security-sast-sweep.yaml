# Security SAST Sweep — Per-Repo SAST + Ollama Triage Workflow
#
# Companion to the ai-skills /security-auditor v3 skill. Runs the same SAST
# pipeline (semgrep + bandit + gitleaks + pip-audit) but as a forge workflow
# so it can be scheduled, budget-tracked, and Ollama-routed for $0/run cost.
#
# Distinct from the existing security-audit.yaml workflow (which is a pure-
# Claude conceptual audit with 100K token budget). This one is SAST-first,
# Ollama-triaged, $0 cost.
#
# Writes SECURITY_FINDINGS.md to the audited repo's root.
#
# For fleet sweeps, invoke once per repo from a shell loop:
#
#   for repo in ~/projects/{EVE_Gatekeeper,anchormd,memboot,BenchGoblins,Argus_Overview,Dossier,tiaid}; do
#     animus-forge workflow run security-sast-sweep --var repo_path="$repo"
#   done
#
# Cross-repo aggregation is done by /security-sweep (ai-skills), not here.

name: security-sast-sweep
version: 1.0.0
description: SAST + Ollama-triaged security audit for one repository (per-repo, $0 cost via Ollama)
tags: [security, sast, ollama, fleet, free]

inputs:
  repo_path:
    type: string
    required: true
    description: Absolute path to the repository to audit
  triage_model:
    type: string
    required: false
    default: "qwen2.5:14b"
    description: Ollama model used for finding triage
  output_path:
    type: string
    required: false
    default: ""
    description: Path to write SECURITY_FINDINGS.md (default = <repo>/SECURITY_FINDINGS.md)

outputs:
  - audit_report
  - findings_count

# token_budget left at default (100000). Ollama triage doesn't consume tokens,
# so the budget is effectively unused. Keep > 1000 to pass loader validation.
timeout_seconds: 600

steps:
  # ---------------------------------------------------------------------------
  # Phase 0 — Tool inventory
  # ---------------------------------------------------------------------------
  - id: tool_inventory
    type: shell
    description: Confirm SAST tools are available
    params:
      command: |
        set -u
        echo "=== Tool Inventory ==="
        for t in semgrep bandit gitleaks pip-audit; do
          if command -v "$t" > /dev/null; then echo "OK $t"; else echo "MISSING $t"; fi
        done
      timeout_seconds: 10

  # ---------------------------------------------------------------------------
  # Phase 1 — SAST sweep in parallel (each tool independent)
  # ---------------------------------------------------------------------------
  - id: sast_parallel
    type: parallel
    description: Run all SAST tools in parallel
    params:
      strategy: threading
      max_workers: 4
      fail_fast: false
      steps:
        - id: semgrep_scan
          type: shell
          description: Semgrep multi-language SAST (python+security+secrets+owasp packs)
          params:
            command: |
              cd "${repo_path}"
              mkdir -p /tmp/forge-sec
              semgrep --config=p/python --config=p/security-audit \
                      --config=p/secrets --config=p/owasp-top-ten \
                      --json --output=/tmp/forge-sec/semgrep.json \
                      --metrics=off --quiet . 2>&1 || true
            timeout_seconds: 300

        - id: bandit_scan
          type: shell
          description: Bandit Python AST security linter
          params:
            command: |
              cd "${repo_path}"
              mkdir -p /tmp/forge-sec
              if [ -d src ]; then
                bandit -r src/ -f json -o /tmp/forge-sec/bandit.json --quiet 2>&1 || true
              else
                echo '{"results":[],"metrics":{"_totals":{"loc":0}}}' > /tmp/forge-sec/bandit.json
              fi
            timeout_seconds: 60

        - id: gitleaks_scan
          type: shell
          description: Gitleaks secret scan (working tree + git history)
          params:
            command: |
              cd "${repo_path}"
              mkdir -p /tmp/forge-sec
              gitleaks detect --report-format=json \
                      --report-path=/tmp/forge-sec/gitleaks.json \
                      --no-banner 2>&1 | tail -3 || true
              test -f /tmp/forge-sec/gitleaks.json || echo '[]' > /tmp/forge-sec/gitleaks.json
            timeout_seconds: 60

        - id: pip_audit_scan
          type: shell
          description: Pip-audit dependency vulnerability scan (venv-local)
          params:
            command: |
              cd "${repo_path}"
              mkdir -p /tmp/forge-sec
              if [ -d .venv ]; then
                .venv/bin/python -m pip_audit --format=json > /tmp/forge-sec/pip-audit.json 2>/dev/null || \
                  echo '{"dependencies":[]}' > /tmp/forge-sec/pip-audit.json
              else
                echo '{"dependencies":[]}' > /tmp/forge-sec/pip-audit.json
              fi
            timeout_seconds: 60

  # ---------------------------------------------------------------------------
  # Phase 2 — Consolidate findings for triage
  # ---------------------------------------------------------------------------
  - id: consolidate_findings
    type: shell
    description: Merge all tool outputs into one JSON for triage
    depends_on: [sast_parallel]
    outputs:
      - findings_json
    params:
      command: |
        python3 << 'PYEOF'
        import json
        from pathlib import Path

        out = {"semgrep": [], "bandit": [], "gitleaks": [], "pip_audit": []}

        try:
            sg = json.load(open("/tmp/forge-sec/semgrep.json"))
            for r in sg.get("results", []):
                out["semgrep"].append({
                    "rule": r["check_id"],
                    "file": r["path"],
                    "line": r["start"]["line"],
                    "severity": r["extra"].get("severity", "unknown"),
                    "message": r["extra"]["message"][:300],
                })
        except Exception as e:
            out["semgrep_error"] = str(e)

        try:
            bd = json.load(open("/tmp/forge-sec/bandit.json"))
            for r in bd.get("results", []):
                out["bandit"].append({
                    "rule": r["test_id"],
                    "file": r["filename"],
                    "line": r["line_number"],
                    "severity": r["issue_severity"],
                    "confidence": r["issue_confidence"],
                    "message": r["issue_text"][:300],
                })
        except Exception as e:
            out["bandit_error"] = str(e)

        try:
            gl = json.load(open("/tmp/forge-sec/gitleaks.json"))
            if isinstance(gl, list):
                for r in gl:
                    out["gitleaks"].append({
                        "rule": r.get("RuleID"),
                        "file": r.get("File"),
                        "line": r.get("StartLine"),
                        "severity": "critical",
                        "message": r.get("Description", "")[:300],
                    })
        except Exception:
            pass

        try:
            pa = json.load(open("/tmp/forge-sec/pip-audit.json"))
            for dep in pa.get("dependencies", []):
                for v in dep.get("vulns", []):
                    out["pip_audit"].append({
                        "package": dep["name"],
                        "version": dep["version"],
                        "cve": v["id"],
                        "severity": v.get("severity", "unknown"),
                        "fix_versions": v.get("fix_versions", []),
                    })
        except Exception as e:
            out["pip_audit_error"] = str(e)

        total = sum(len(v) for k, v in out.items() if isinstance(v, list))
        out["total_raw_findings"] = total
        Path("/tmp/forge-sec/all_findings.json").write_text(json.dumps(out, indent=2))
        # Print the JSON to stdout so it can be referenced as ${findings_json}
        # by downstream steps (forge maps the first declared output to stdout).
        print(json.dumps(out, indent=2))
        PYEOF
      timeout_seconds: 30

  # ---------------------------------------------------------------------------
  # Phase 3 — Ollama triage (qwen2.5:14b — $0 cost via HybridBackend)
  # ---------------------------------------------------------------------------
  - id: ollama_triage
    type: ollama
    description: Triage raw SAST findings — classify real vs false-positive, recommend remediation
    depends_on: [consolidate_findings]
    outputs:
      - triage_response
    # NOTE: model and prompt MUST be under params: — the StepConfig loader
    # (loader.py:148) only reads `data.get("params", {})`. Top-level fields
    # like `model:`/`prompt:` get silently dropped. fleet-degraded.yaml and
    # similar reference workflows have the same latent bug — they probably
    # never executed via the current executor.
    params:
      # Inlined model literal — forge does not currently substitute input
      # defaults into ${triage_model} when --var isn't provided.
      model: "qwen2.5:14b"
      prompt: |
        You are triaging SAST (static-analysis security testing) findings for the
        repository at ${repo_path}.

        Raw findings JSON (from semgrep + bandit + gitleaks + pip-audit):
        ${findings_json}

        For each finding, classify:
        - reality: "real" | "false-positive" | "requires-runtime-test"
        - severity: "critical" | "high" | "medium" | "low" | "info"
        - confidence: "high" | "medium" | "low"
        - reasoning: one paragraph explaining the classification
        - remediation: one paragraph fix (only for "real" findings)

        IMPORTANT triage rules:
        - CLI tools running on the user's own machine have no remote attack
          surface. urlopen() or subprocess() with user-provided flags is NOT
          a vulnerability — it's "user attacking themselves" which is not a
          credible threat.
        - Constant-list subprocess args (e.g., ["git", "--version"]) cannot
          be shell-injected. Mark false-positive with confidence: high.
        - Real vulns require: untrusted input + sink + reachable code path.
        - gitleaks and pip-audit findings are almost always real (real
          secrets in commits, real CVEs in dependencies).
        - shell=True with non-user input is NOT a vulnerability.

        Output:
        1. A markdown table: file:line | tool | severity | reality | confidence | summary
        2. For each "real" finding: detailed remediation guidance

        Be calibrated. Severity inflation causes alert fatigue. The point
        of triage is to filter noise, not amplify it.

  # ---------------------------------------------------------------------------
  # Phase 4 — Write SECURITY_FINDINGS.md
  # ---------------------------------------------------------------------------
  - id: write_report
    type: shell
    description: Persist triage output to SECURITY_FINDINGS.md
    depends_on: [ollama_triage]
    params:
      command: |
        # Write the triage response to a temp file FIRST so we don't have to
        # escape it for bash heredoc / python triple-quote. forge substitutes
        # ${triage_response} into this command string before bash runs; the
        # response can contain backticks, $signs, quotes, """, etc. that break
        # all the obvious escaping strategies. Round-trip via file is safest.
        cat > /tmp/forge-sec/triage_response.txt <<'TRIAGE_EOF'
        ${triage_response}
        TRIAGE_EOF
        python3 << 'PYEOF'
        from pathlib import Path
        from datetime import datetime, timezone

        triage = Path('/tmp/forge-sec/triage_response.txt').read_text().strip()
        raw_json = Path('/tmp/forge-sec/all_findings.json').read_text()
        repo_path = "${repo_path}"
        date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

        report = f"""# Security Audit Report

        **Date:** {date}
        **Repo:** {repo_path}
        **Workflow:** security-sast-sweep v1.0.0 (animus-forge)
        **Triage model:** qwen2.5:14b (Ollama, $0 cost)

        ## Raw SAST Findings (Pre-Triage)

        ```json
        {raw_json}
        ```

        ## Triage Output

        {triage}

        ---

        _Auto-generated by `animus-forge run packages/forge/workflows/security-sast-sweep.yaml`._
        """
        # The f-string is indented 8 spaces to satisfy YAML; strip that uniform
        # indent so the rendered markdown is left-aligned.
        report = "\n".join(line[8:] if line.startswith("        ") else line for line in report.splitlines())

        out = Path(repo_path) / "SECURITY_FINDINGS.md"
        out.write_text(report)
        print(f"Report written: {out}")
        PYEOF
        echo "Report written: $OUT"
      timeout_seconds: 10

  # ---------------------------------------------------------------------------
  # Phase 5 — Discord notify on HIGH/CRITICAL (optional, fleet-monitor integration)
  # ---------------------------------------------------------------------------
  - id: notify_critical
    type: shell
    description: Emit Discord alert via fleet-monitor if real HIGH/CRITICAL findings present
    depends_on: [ollama_triage]
    on_failure: skip
    params:
      command: |
        HIGH_COUNT=$(echo "${triage_response}" | grep -ciE 'real.*high|real.*critical' || echo 0)
        if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "ALERT: $HIGH_COUNT real HIGH/CRITICAL findings in ${repo_path}"
            if [ -n "${FLEET_DISCORD_WEBHOOK:-}" ]; then
                curl -s -X POST -H "Content-Type: application/json" \
                  -d "{\"content\":\"⚠️ Security: ${repo_path} has $HIGH_COUNT real HIGH/CRITICAL findings\"}" \
                  "$FLEET_DISCORD_WEBHOOK" > /dev/null || true
            else
                echo "FLEET_DISCORD_WEBHOOK env var not set — skipping Discord."
            fi
        else
            echo "No HIGH/CRITICAL real findings — no notification."
        fi
      timeout_seconds: 10

metadata:
  author: claude-code
  category: security
  tags: [sast, ollama, fleet, free-triage, security]

evolution_notes:
  - "2026-05-10 v1.0.0 initial scaffold. Validated SAST tool chain end-to-end on memboot (see memboot/SECURITY_FINDINGS.md, commit b9ea664). YAML syntax valid."
  - |
    2026-05-10 Phase 4 validation REVISED — initial finding was wrong:
    The `animus-forge run` CLI DOES load YAML workflows from
    `packages/forge/workflows/`. `cli/commands/workflow.py:61-74` has an
    explicit YAML branch that calls `animus_forge.workflow.loader.load_workflow()`
    for any `.yaml`/`.yml` file path.

    My initial dry-run failed only because `token_budget: 0` violated the
    loader's `>= 1000` validator (loader.py:402). Removing that field
    (default 100000 — harmless because steps route to Ollama which doesn't
    consume Anthropic tokens) made the CLI accept the workflow cleanly.

    Dry-run verified: all 6 steps load with correct types (shell/parallel/
    ollama recognized), `repo_path` variable bound, no validation errors.

    Invocation:
    `animus-forge run packages/forge/workflows/security-sast-sweep.yaml --var repo_path=/path/to/repo`
  - |
    2026-05-10 Phase 4 end-to-end validation — surfaced TWO real forge bugs
    + 1 architectural limit:

    BUG #1 (fixed in this workflow, latent in others): The StepConfig loader
    (loader.py:148) reads `params = data.get("params", {})`. Top-level
    `model:`, `prompt:` fields are SILENTLY DROPPED. The `_execute_ollama`
    handler (executor_ai.py:218-219) reads from `step.params`, so a step
    that doesn't nest under `params:` gets an empty prompt and empty model.
    Reference workflows like fleet-degraded.yaml, fleet-incident-triage.yaml,
    fleet-service-down.yaml all have this latent bug — they declare ollama
    fields at the top level and would silently produce empty-prompt Ollama
    calls if ever executed. They probably never were.

    BUG #2 (workaround attempted, still failing): Step outputs must be
    explicitly declared via `outputs: [name]` on the producing step to be
    visible to downstream steps as `${name}` variables. Without that
    declaration, the step result lives in `step_result.output` but never
    gets promoted to `_context`. Confirmed via executor_core.py:327-336.

    ARCHITECTURAL LIMIT: forge's variable interpolation happens at the
    command-string level BEFORE bash parses. When `${triage_response}` is
    a multi-KB Ollama response containing shell metacharacters (backticks,
    $signs, single/double quotes, EOF tokens, etc.), no heredoc-quoting
    strategy in the YAML survives because the substitution is already done
    by the time bash sees the command. Confirmed via repeated write_report
    failures with "Command failed with code 2: /bin/sh: <line>".

    Workaround paths (none ideal):
    a. Have the ollama step output go to disk via memory_manager
       (forge-internal API, not exposed in YAML).
    b. Add a forge step type `python` that accepts variables via a safer
       channel than shell command-string substitution (requires engine work).
    c. Add a new forge feature: write step outputs to per-step temp files
       and reference via file path instead of value substitution (engine
       work).
    d. Accept this constraint: workflows that need to round-trip large
       LLM outputs into reports must keep the LLM output to <few hundred
       bytes OR include their own escape-safe persistence path.

    Current workflow state (2026-05-10):
    - Phases 1-3 (tool inventory, SAST, consolidate) work end-to-end.
    - Phase 4 (ollama_triage) runs cleanly, produces real output (2.5K-4.3K
      tokens of triage analysis observed).
    - Phase 5 (write_report) fails with shell escape error on the triage
      output. The SECURITY_FINDINGS.md is not overwritten when write_report
      fails, so existing reports survive.
    - Phase 6 (notify_critical) fails as collateral (depends on write_report).

    Until the architectural limit is addressed, fleet sweeps should run
    via the ai-skills `/security-auditor` skill (which executes inside a
    Claude Code session and doesn't have this constraint), NOT via this
    forge workflow. The forge workflow remains useful as scaffolding for
    when the engine gains a safer variable-passing channel.

    Earlier evolution_note claiming the CLI couldn't load these YAMLs was
    wrong and corrected by the 2026-05-10 REVISED note above.
  - "Triage is single-shot (one ollama call for all findings). For repos with >50 findings, qwen2.5:14b 32k context may overflow. Future: chunk findings by file or rule category before triage, or upgrade to a larger context model."
  - "--diff mode (compare to previous SECURITY_FINDINGS.md) is a v2 feature — needs a parse-prev step before consolidate_findings."
  - "--patches mode (generate unified-diff per real finding) is a v2 feature — needs a second ollama call per real finding."
  - "FLEET_DISCORD_WEBHOOK env var wires Phase 5 alerts. Set in fleet-monitor's env, not in this workflow."
