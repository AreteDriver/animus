[package]
name = "animus-quorum-core"
version = "0.1.0"
edition = "2021"
description = "High-performance core for Animus Quorum intent graph"

[lib]
name = "animus_quorum_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "intent_graph"
harness = false

[profile.release]
opt-level = 3
lto = true
