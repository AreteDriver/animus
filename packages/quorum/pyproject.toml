[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "animus-quorum"
version = "1.2.0"
description = "Multi-agent coherence and coordination for AI systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "your-org" }
]
keywords = ["multi-agent", "ai", "orchestration", "convergence", "intent-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
llm = [
    "anthropic>=0.39.0",
]

[project.urls]
Homepage = "https://github.com/your-org/animus"
Repository = "https://github.com/your-org/animus"
Issues = "https://github.com/your-org/animus/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "animus_quorum._core"
python-packages = ["animus_quorum"]
python-source = "python"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.coverage.run]
source = ["python/animus_quorum"]
omit = ["*/tests/*"]

[tool.mypy]
python_version = "3.10"
strict = true
