[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animus-kernel"
version = "0.1.1"
description = "Autonomous builder engine — budget, executor, sandbox, and multi-agent orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "AreteDriver"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "animus-types>=0.1.0,<1",
    "pydantic >=2.0",
    "pydantic-settings >=2.0",
    "rich >=13.0",
    "httpx >=0.27",
    "typer >=0.12",
    "sqlalchemy >=2.0",
    "psycopg2-binary >=2.9",
    "jsonschema >=4.17",
    "pyyaml >=6.0",
    "apscheduler >=3.11,<4",
]

[project.optional-dependencies]
openai = ["openai >=1.30"]
anthropic = ["anthropic >=0.28"]
all = ["openai >=1.30", "anthropic >=0.28"]
dev = ["pytest >=8.0", "pytest-asyncio >=0.23", "pytest-cov >=6.0", "ruff >=0.4", "mypy >=1.10"]

[project.urls]
Homepage = "https://github.com/AreteDriver/animus"
Documentation = "https://github.com/AreteDriver/animus/tree/main/packages/kernel#readme"

[project.scripts]
animus-kernel = "animus_kernel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/animus_kernel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B904"]
per-file-ignores = { "tests/**" = ["B007", "B017"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/animus_kernel"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/benchmarks/*",
]

[tool.coverage.report]
precision = 1
skip_covered = false
show_missing = true
fail_under = 21
