[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animus-kernel"
version = "0.1.0"
description = "Autonomous builder engine — budget, executor, sandbox, and multi-agent orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AreteDriver"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic >=2.0",
    "rich >=13.0",
    "httpx >=0.27",
    "typer >=0.12",
    # Provider deps — optional
    "openai >=1.30; extra == 'openai'",
    "anthropic >=0.28; extra == 'anthropic'",
]

[project.optional-dependencies]
all = ["openai", "anthropic"]
dev = ["pytest >=8.0", "pytest-asyncio >=0.23", "ruff >=0.4", "mypy >=1.10"]

[project.urls]
Homepage = "https://github.com/AreteDriver/animus"
Documentation = "https://github.com/AreteDriver/animus/tree/main/packages/kernel#readme"

[project.scripts]
animus-kernel = "animus_kernel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/animus_kernel"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
