[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animus-contracts"
version = "0.1.0"
description = "Canonical JSON schemas for the Animus monorepo — actions, events, assessments, memories, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AreteDriver" },
]
keywords = ["json-schema", "contracts", "animus", "ai", "exocortex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.17.0",
    "referencing>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/animus_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"*.schema.json" = "animus_contracts/"
